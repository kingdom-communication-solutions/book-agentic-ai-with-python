<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">Role and task prompt fields</title><desc id="desc">Vector code-cell guide. Callout 4 identifies the empty role_prompt string. Callout 5 identifies the return value of make_request(email). Both are learner tasks.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#bd7800"/></marker></defs><rect x="1" y="1" width="958" height="438" rx="8" fill="#ffffff" stroke="#b4c2d0"/><rect x="1" y="1" width="958" height="57" rx="8" fill="#eff3f7" stroke="#b4c2d0"/><text x="24" y="38" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#17324f">3. Write the role and task</text><text x="25" y="94" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#17324f">Complete the two empty strings in this code cell.</text><rect x="22" y="117" width="916" height="285" rx="4" fill="#f4f6f8" stroke="#b4c2d0"/><text x="41" y="153" font-family="Courier New, monospace" font-size="20" font-weight="normal" fill="#42745c"># TODO: write the role and behaviour instructions.</text><text x="41" y="190" font-family="Courier New, monospace" font-size="23" font-weight="normal" fill="#17324f">role_prompt = &quot;&quot;</text><text x="41" y="257" font-family="Courier New, monospace" font-size="23" font-weight="normal" fill="#17324f">def make_request(email):</text><text x="65" y="294" font-family="Courier New, monospace" font-size="20" font-weight="normal" fill="#42745c"># TODO: include the task, context and email.</text><text x="65" y="333" font-family="Courier New, monospace" font-size="23" font-weight="normal" fill="#17324f">return &quot;&quot;</text><path d="M803,185 L268,185" stroke="#bd7800" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="825" cy="185" r="22" fill="#ffcf5a" stroke="#17324f" stroke-width="2"/><text x="818" y="193" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#17324f">4</text><path d="M803,328 L195,328" stroke="#bd7800" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="825" cy="328" r="22" fill="#ffcf5a" stroke="#17324f" stroke-width="2"/><text x="818" y="336" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#17324f">5</text></svg>